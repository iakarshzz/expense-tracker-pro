<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker Pro</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


    <!-- CSS Files -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    
</head>


<body>


    <div class="app">


        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                Expense Tracker Pro
            </div>


            <nav>

                <ul>

                    <li>🏠 Dashboard</li>
                    <li>💳 Transactions</li>
                    <li>📊 Analytics</li>
                    <li>🎯 Budgets</li>
                    <li>⭐ Goals</li>
                    <li>⚙ Settings</li>

                </ul>

            </nav>


        </aside>




        <!-- Main Content -->
        <main class="main">


            <!-- Navbar -->
            <header class="navbar">

                <h1>
                    Dashboard
                </h1>


                <button>
                    🌙
                </button>


            </header>




            <!-- Dashboard Content -->
            <section class="dashboard">


                <div class="card">

                    <p>Total Balance</p>
                    <h2>$0</h2>

                </div>



                <div class="card">

                    <p>Total Income</p>
                    <h2>$0</h2>

                </div>



                <div class="card">

                    <p>Total Expense</p>
                    <h2>$0</h2>

                </div>



                <div class="card">

                    <p>Savings</p>
                    <h2>$0</h2>

                </div>



            </section>



        </main>


    </div>


</body>

</html>
